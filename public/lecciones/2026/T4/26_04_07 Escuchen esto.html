<script>
  // Esqueleto de carga: la lección se dibuja con su geometría real y cada
  // texto se muestra como una barra gris en su posición exacta. Cuando las
  // fuentes están listas (y tras un mínimo breve) aparece el contenido.
  (function () {
    var root = document.documentElement;
    root.classList.add('sk', 'sk-wait', 'is-loading');
    var MIN = 450, MAX_FONTS = 2000;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var wait = function (ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); };
    var dom = new Promise(function (ok) {
      if (document.readyState !== 'loading') ok();
      else document.addEventListener('DOMContentLoaded', ok);
    });
    // Se piden explícitamente las fuentes que usa la lección; si no, el
    // navegador puede darlas por "listas" antes de empezar a descargarlas.
    var fonts = dom.then(function () {
      if (!document.fonts || !document.fonts.load) return null;
      var faces = ['400 16px "Outfit Variable"', '600 16px "Outfit Variable"',
                   '400 16px "Newsreader Variable"', 'italic 400 16px "Newsreader Variable"'];
      var loads = Promise.all(faces.map(function (f) { return document.fonts.load(f); }))
        .then(function () { return document.fonts.ready; });
      return Promise.race([loads, wait(MAX_FONTS)]);
    });
    // Mientras llegan las fuentes no se muestra nada: así el esqueleto ya
    // tiene el tamaño definitivo y no se mueve.
    fonts.then(function () { root.classList.remove('sk-wait'); });
    Promise.all([fonts, wait(MIN)]).then(function () {
      requestAnimationFrame(function () {
        // La animación de entrada de la página desplazaría el contenido.
        var fi = document.querySelectorAll('.fade-in');
        for (var i = 0; i < fi.length; i++) fi[i].classList.remove('fade-in');
        root.classList.remove('is-loading');
        setTimeout(function () { root.classList.remove('sk'); }, reduce ? 0 : 450);
      });
    });
  })();
</script>

<script>
(function(){

  var qn = 0;

  function v(label, text){
    return '<div class="verse-block"><span class="block-label">' + label + '</span><blockquote>' + text + '</blockquote></div>';
  }
  function e(paras, cite){
    if(typeof paras === 'string'){ paras = [paras]; }
    var inner = paras.map(function(t){ return '<blockquote>' + t + '</blockquote>'; }).join('');
    return '<div class="egw-block"><span class="block-label">ESPÍRITU DE PROFECÍA</span>' + inner + '<cite>' + cite + '</cite></div>';
  }
  function q(question, answer){
    qn++;
    var id = 'a' + qn;
    return '<div class="question-card">' +
      '<span class="question-label">PREGUNTA ' + qn + ' PARA DISCUSIÓN</span>' +
      '<p class="question-text">' + question + '</p>' +
      '<button class="answer-toggle" aria-expanded="false" data-answer="' + id + '">Ver respuesta orientativa</button>' +
      '<div class="answer-panel" id="' + id + '"><span class="who">GUÍA PARA EL MAESTRO</span>' + answer + '</div>' +
    '</div>';
  }

  var pages = [

    /* 0 ---------------- PORTADA */
    {
      tag: "Lección 7 · 4to trimestre 2026",
      title: "Portada",
      html:
        '<div class="cover"><span class="kicker">4TO TRIMESTRE 2026 · LECCIÓN 7</span><h1>¡Escuchen esto!</h1><p class="subtitle">Dios sigue hablando. La pregunta de esta semana no es si su voz llega, sino qué hacemos nosotros cuando su mensaje contradice lo que queremos creer o hacer.</p><div class="memory-verse">«Y estas cosas les acontecieron como ejemplo, y están escritas para amonestarnos a nosotros, a quienes han alcanzado los fines de los siglos.»<cite>1 Corintios 10:11 — Texto para memorizar</cite></div><p class="readings"><b>Lee para el estudio de esta semana:</b> Números 13:26-30; Jeremías 36:20-26; 2 Crónicas 36:15-16; Mateo 23:30-35; 1 Corintios 10:6-12.</p><button class="start-btn" id="startBtn">Comenzar la clase →</button></div>'
    },

    /* 1 ---------------- PUNTO DE PARTIDA */
    {
      tag: "Punto de partida",
      title: "¿Mi verdad o la Verdad?",
      html:
        '<p class="lead">Vivimos en la época de «mi verdad». Se nos anima a decir lo que sentimos, lo que necesitamos y lo que creemos, y se da por sentado que cada «verdad» personal es válida y no debe ser cuestionada.</p>' +
        '<p>Piensa en algo tan simple como mentir. Alguien dice: «Mentir está mal». Otro responde: «Bueno, una mentira piadosa a veces es necesaria». Un tercero: «Hay que mentir cuando conviene». ¿En qué quedamos? Cuando cada uno define lo que es verdad, al final nadie sabe cuál es el camino.</p>' +
        '<p>Las personas siempre merecen respeto. Las ideas, en cambio, necesitan un filtro. Para el cristiano ese filtro no es la opinión de la mayoría ni la propia experiencia, sino una Persona:</p>' +
        v('JUAN 14:6', '«Jesús le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mí.»') +
        '<p>Nosotros no poseemos la verdad: <strong>la Verdad nos posee a nosotros</strong>. Y Cristo nos habla por medio de su Palabra y de sus mensajeros. El problema aparece cuando lo que yo considero verdadero choca con lo que Dios ya reveló.</p>' +
        '<p>La Biblia muestra que esto no es nuevo. Ante la voz de Dios, unos escucharon, reconocieron su error y cambiaron de rumbo; otros se aferraron a sus ideas, rechazaron el mensaje y hasta atacaron a los mensajeros. Muchos profetas fueron criticados, amenazados y asesinados (Heb. 11:32-38), pero siguieron hablando, porque sabían que su mensaje podía ser la diferencia entre la salvación y la destrucción de un pueblo.</p>' +
        e(['Jeremías llamó su atención repetidas veces a los consejos dados en Deuteronomio… Suplicaba: «Preguntad por las sendas antiguas, cuál sea el buen camino, y andad por él, y hallaréis descanso para vuestra alma».'], 'Profetas y reyes, p. 302') +
        '<h2 class="section-h">Una radio y una frecuencia</h2>' +
        '<p>Imagina una radio. La emisora transmite siempre en la misma frecuencia; si no escuchamos bien, el problema no está en la señal. Puede haber interferencias, como el pecado que hace ruido, o puede que el dial esté mal puesto: el orgullo y el egoísmo nos dejan sintonizados en otra estación. Esta semana veremos cómo reaccionaron distintas personas cuando Dios dijo: «¡Escuchen esto!».</p>' +
        q('Cuando lo que «yo siento que es verdad» entra en conflicto con lo que dice la Palabra de Dios, ¿qué debería tener la última palabra? ¿Por qué nos cuesta tanto aceptarlo en la práctica, aunque lo afirmemos en teoría?',
          '<p>Desde la fe, la última palabra la tiene Dios, porque Él no solo dice la verdad: es la Verdad (Juan 14:6; 17:17). Nuestros sentimientos son reales, pero no son una regla confiable: «Engañoso es el corazón más que todas las cosas» (Jer. 17:9).</p><p>Cuesta en la práctica porque la verdad de Dios no solo informa, también confronta. Aceptarla puede implicar perder comodidad, reconocer un error o cambiar una costumbre familiar. Invita a la clase a notar que el relativismo suele aparecer justo donde la verdad incomoda.</p>')
    },

    /* 2 ---------------- ENOJO CONTRA EL MENSAJERO */
    {
      tag: "Enojo contra el mensajero",
      title: "Doce espías, dos informes",
      html:
        '<p class="lead">Israel estaba a las puertas de la tierra prometida. Doce espías regresaron después de cuarenta días y todos habían visto lo mismo: una tierra excelente, ciudades fortificadas y gigantes.</p>' +
        '<p>Diez se concentraron solo en los obstáculos. Caleb vio las mismas ciudades y los mismos gigantes, pero llegó a otra conclusión:</p>' +
        v('NÚMEROS 13:30', '«Entonces Caleb hizo callar al pueblo delante de Moisés, y dijo: Subamos luego, y tomemos posesión de ella; porque más podremos nosotros que ellos.»') +
        '<p>La diferencia no era el tamaño del problema, sino <strong>dónde había puesto cada uno su confianza</strong>. Los diez interpretaron el futuro a partir de sus propias fuerzas; Caleb, recordando quién era el Dios que los había traído hasta allí.</p>' +
        e(['Este no era solamente un informe malo, sino además mentiroso. Era contradictorio; si la tierra era insalubre y devoraba a sus habitantes, ¿cómo era posible que estos tuvieran proporciones tan grandes? Cuando hombres que ocupan posiciones de responsabilidad se entregan a la incredulidad, no hay límites al avance que realizarán en la maldad.'], 'Conflicto y valor, 10 de abril, p. 106') +
        '<p>El miedo se volvió rebelión: «Designemos un capitán, y volvámonos a Egipto» (Núm. 14:4). Cuando Josué y Caleb rogaron que confiaran en Dios, «toda la multitud habló de apedrearlos» (Núm. 14:10). Preferían la esclavitud conocida antes que una promesa que exigía fe.</p>' +
        v('NÚMEROS 14:11', '«Y Jehová dijo a Moisés: ¿Hasta cuándo me ha de irritar este pueblo? ¿Hasta cuándo no me creerán, con todas las señales que he hecho en medio de ellos?»') +
        '<p>El problema no era Moisés. Moisés y Aarón eran los representantes visibles de Dios, y por eso era más fácil descargar sobre ellos la frustración que reconocer la verdadera raíz: <strong>no confiaban en que Dios cumpliría su promesa</strong>.</p>' +
        e(['Cuando los hombres entregan su corazón a la incredulidad, se colocan bajo el dominio de Satanás, y nadie puede decir hasta dónde los llevará.'], 'Patriarcas y profetas, p. 409') +
        '<h2 class="section-h">El mensaje y el mensajero</h2>' +
        '<p>Podemos pensar en la Palabra como el «software» y en el mensajero como el «hardware». Cuando el mensaje no nos gusta, atacamos el aparato. Eso sigue ocurriendo: con un pastor que predica algo incómodo, con un anciano que da un consejo, incluso en casa, cuando un familiar dice algo con buena intención y lo recibimos como un ataque.</p>' +
        q('Confiar en Dios es fácil cuando todo va bien. Pero ¿qué ocurre cuando confiar en Él implica incertidumbre, incomodidad o pérdidas? ¿Qué «Egipto conocido» nos tienta a volver cuando la promesa parece difícil?',
          '<p>La fe se prueba precisamente cuando obedecer cuesta. Israel había visto el mar Rojo abrirse y el maná caer cada mañana, pero al ver los muros de Canaán olvidó todo eso. El miedo distorsiona la memoria y la percepción: nos hace tomar decisiones que nunca tomaríamos con calma.</p><p>Ejemplos actuales de «volver a Egipto»: regresar a un hábito que nos esclavizaba porque al menos era conocido, abandonar la fidelidad en el trabajo por miedo a perder ingresos, o callar una convicción para no perder aceptación. Pregunta a la clase qué recuerdos de la fidelidad de Dios pueden sostenernos en esos momentos.</p>') +
        q('La próxima vez que una enseñanza bíblica (o un consejo sincero) te incomode, ¿cómo puedes saber si tu reacción nace de una convicción bíblica o del miedo a perder algo que no quieres entregar?',
          '<p>Algunas señales de que el problema es el mensaje y no el mensajero: me enfoco en los defectos de quien habló en lugar de en lo que dijo; busco argumentos para no cambiar antes de orar al respecto; me enojo más de lo proporcionado.</p><p>Un ejercicio práctico: separar las dos preguntas. Primero, «¿esto es bíblico?». Después, «¿cómo lo dijo?». Una persona puede comunicar una verdad con torpeza, y aun así seguir siendo verdad. Antes de discutir con el mensajero, conviene alinear el corazón con el mensaje.</p>')
    },

    /* 3 ---------------- OTRO ESPÍRITU */
    {
      tag: "Otro espíritu",
      title: "Caleb: cuarenta y cinco años de fidelidad",
      html:
        '<p class="lead">La historia de los espías no termina con la rebelión. Dios hizo una distinción entre los que se dejaron llevar por el miedo y el hombre que confió.</p>' +
        v('NÚMEROS 14:24', '«Pero a mi siervo Caleb, por cuanto hubo en él otro espíritu, y decidió ir en pos de mí, yo le meteré en la tierra donde entró, y su descendencia la tendrá en posesión.»') +
        '<p>Lo impresionante es lo que vino después. Caleb fue fiel, pero tuvo que caminar cuarenta años por el desierto a causa de la incredulidad de otros. Vio morir a toda una generación. Y no se amargó.</p>' +
        '<p>Cuando por fin entraron en Canaán, con ochenta y cinco años, pidió precisamente el territorio que había asustado a los demás:</p>' +
        v('JOSUÉ 14:12', '«Dame, pues, ahora este monte, del cual habló Jehová aquel día; porque tú oíste en aquel día que los anaceos están allí, y que hay ciudades grandes y fortificadas. Quizá Jehová estará conmigo, y los echaré, como Jehová ha dicho.»') +
        e(['Había sobrellevado con su pueblo la larga peregrinación por el desierto, y compartido las desilusiones y las cargas de los culpables; no obstante, no se quejó de esto, sino que ensalzó la misericordia de Dios que le había guardado en el desierto cuando sus hermanos eran eliminados…', 'Los incrédulos habían visto sus temores cumplidos. No obstante la promesa de Dios, habían dicho que era imposible heredar la tierra de Canaán, y no la poseyeron. Pero los que confiaron en Dios y no consideraron tanto las dificultades que se habían de encontrar como la fuerza de su Ayudador todopoderoso, entraron en la buena tierra.'], 'Conflicto y valor, 27 de abril, p. 123') +
        '<p>Fíjate en la frase: <em>«Los incrédulos habían visto sus temores cumplidos»</em>. Dios les dijo: «según habéis hablado a mis oídos, así haré yo con vosotros» (Núm. 14:28). La incredulidad tiene una forma de convertirse en profecía autocumplida.</p>' +
        q('Caleb sufrió durante cuarenta años las consecuencias de decisiones que no fueron suyas, y aun así no perdió su fe ni su gratitud. ¿Cómo se mantiene la fidelidad cuando estamos rodeados de incredulidad, o cuando pagamos el precio de los errores de otros?',
          '<p>Caleb tenía «otro espíritu»: no dependía del ánimo del grupo. Su fe estaba anclada en la promesa de Dios, no en las circunstancias. Por eso pudo esperar sin amargarse y, ya anciano, seguir pidiendo montes difíciles.</p><p>Lleva la conversación a situaciones reales: una familia afectada por las decisiones de un miembro, una iglesia que atraviesa conflictos, un ambiente laboral cínico. La gratitud por lo que Dios sí ha hecho fue la clave de Caleb; también puede ser la nuestra.</p>')
    },

    /* 4 ---------------- EL ROLLO EN EL BRASERO */
    {
      tag: "El rollo en el brasero",
      title: "Lo que no se puede quemar",
      html:
        '<p class="lead">Judá se acercaba a la tragedia. Idolatría, injusticia, opresión y hasta sacrificios de niños se habían vuelto normales. Aun así, Dios seguía hablando, porque todavía quería salvarlos.</p>' +
        '<p>Jeremías dictó a Baruc todas las advertencias en un rollo. El propósito era claro: «Quizá oiga la casa de Judá… y se arrepienta cada uno de su mal camino, y yo perdonaré su maldad» (Jer. 36:3). El rollo llegó a la sala de invierno del rey Joacim.</p>' +
        v('JEREMÍAS 36:23-24', '«Cuando Jehudí había leído tres o cuatro planas, lo rasgó el rey con un cortaplumas de escriba, y lo echó en el fuego que había en el brasero, hasta que todo el rollo se consumió sobre el fuego que en el brasero había. Y no tuvieron temor ni rasgaron sus vestidos el rey y todos sus siervos que oyeron todas estas palabras.»') +
        '<h2 class="section-h">Un padre que rasgó sus vestidos, un hijo que rasgó el rollo</h2>' +
        '<p>El detalle del versículo 24 es intencional. Años antes, cuando le leyeron el libro de la ley a Josías, el padre de Joacim, la reacción fue opuesta: «Y cuando el rey hubo oído las palabras del libro de la ley, rasgó sus vestidos» (2 Rey. 22:11). Josías rasgó su ropa en arrepentimiento; Joacim rasgó la Palabra. La fe no se hereda automáticamente: cada generación decide cómo responder.</p>' +
        '<p>Hubo tres hombres, Elnatán, Delaía y Gemarías, que rogaron al rey que no quemara el rollo, «y no los quiso oír» (Jer. 36:25). Siempre hay voces que Dios pone cerca de nosotros para frenarnos antes del error.</p>' +
        '<p>Joacim podía quemar el rollo, pero no podía quemar la verdad. Dios mandó escribirlo de nuevo, y añadió una sentencia sobre el rey (Jer. 36:27-31). Rechazar una advertencia no hace desaparecer aquello sobre lo cual fuimos advertidos.</p>' +
        e(['Estas palabras demuestran vívidamente la poca voluntad que tiene el Señor para castigar. Retiene sus juicios para suplicar a los impenitentes… Aunque durante mucho tiempo se habían extraviado en la idolatría y habían despreciado sus amonestaciones, les declara ahora su buena voluntad para postergar el castigo y para darles otra oportunidad de arrepentirse.'], 'Profetas y reyes, pp. 303-305') +
        '<p>Hoy hacemos lo mismo con métodos más discretos: ignoramos un texto, evitamos un tema, abandonamos una conversación, desacreditamos a quien nos confronta o escogemos la interpretación más cómoda. Las campañas de seguridad vial no prohíben correr para arruinarnos el viaje, sino para que lleguemos vivos. Cuando Dios señala un camino peligroso, no está quitándonos libertad; está intentando evitarnos un dolor que todavía no alcanzamos a ver.</p>' +
        q('¿Qué nos dice acerca del carácter de Dios el hecho de que siguiera intentando llegar al corazón de su pueblo, a pesar de su rebeldía, incluso después de que el rey quemara el rollo?',
          '<p>Revela un Dios que no se rinde fácilmente. Mandó reescribir el rollo y, aun en medio del juicio, prometió restauración: «Aún se comprarán casas, heredades y viñas en esta tierra» (Jer. 32:15). Sus advertencias nacen del amor, no del deseo de castigar (Eze. 33:11).</p><p>También muestra que su paciencia tiene un propósito: darnos tiempo para volver. Ayuda a la clase a ver las advertencias de Dios como un acto de misericordia, no como amenazas de un juez impaciente.</p>') +
        q('Piensa en la parte de la Palabra de Dios que más resistencia te produce. La pregunta no es si puedes ignorarla, sino esta: ¿qué podría estar intentando evitar Dios en tu vida precisamente mediante aquello que te cuesta escuchar?',
          '<p>Esta es una pregunta para la reflexión personal; no es necesario que nadie revele detalles. Puedes dar un momento de silencio y luego invitar a quien quiera compartir un principio general.</p><p>Ejemplos que pueden ayudar: el consejo sobre el uso del tiempo puede proteger la familia; los principios de salud, el cuerpo; el llamado al perdón, el corazón. Detrás de cada «no» de Dios suele haber un «sí» más grande que todavía no vemos.</p>')
    },

    /* 5 ---------------- ESCARNIO */
    {
      tag: "Escarnio",
      title: "Hasta que no hubo remedio",
      html:
        '<p class="lead">Lo que hizo Joacim no fue un caso aislado. La historia de Israel y Judá muestra un patrón que se repitió durante generaciones.</p>' +
        v('2 CRÓNICAS 36:15-16', '«Y Jehová el Dios de sus padres envió constantemente palabra a ellos por medio de sus mensajeros, porque él tenía misericordia de su pueblo y de su habitación. Mas ellos hacían escarnio de los mensajeros de Dios, y menospreciaban sus palabras, burlándose de sus profetas, hasta que subió la ira de Jehová contra su pueblo, y no hubo ya remedio.»') +
        '<p>Observa la progresión: primero la <strong>burla</strong> hacia los mensajeros, luego el <strong>menosprecio</strong> de sus palabras y finalmente un rechazo sistemático. Rechazar la verdad una y otra vez endurece el corazón, hasta que ya no queda «remedio».</p>' +
        '<p>El último rey, Sedequías, tuvo acceso directo a Jeremías. Sin embargo, «hizo lo malo ante los ojos de Jehová su Dios, y no se humilló delante del profeta Jeremías, que le hablaba de parte de Jehová» (2 Crón. 36:12). Jeremías era un ser humano con temores y limitaciones, pero rechazar su mensaje era rechazar al Dios que lo enviaba.</p>' +
        '<p>Además, los mensajeros de Dios no solo enfrentaron indiferencia, sino competencia. Había profetas que decían lo que la gente quería oír: «No escuchéis las palabras de los profetas que os profetizan; os alimentan con vanas esperanzas; hablan visión de su propio corazón, no de la boca de Jehová» (Jer. 23:16).</p>' +
        e(['Sacerdotes, falsos profetas y pueblo se volvieron, airados, contra el que no quería decirles cosas agradables o profetizarles engaño. Así fue despreciado el mensaje de Dios, y su siervo, amenazado de muerte…', 'Siendo de naturaleza tímida y sosegada, Jeremías anhelaba la paz y la tranquilidad de una vida retraída, en la cual no necesitase presenciar la continua impenitencia de su amada nación. Su corazón quedaba desgarrado por la angustia que le ocasionaba la ruina producida por el pecado.'], 'Profetas y reyes, pp. 307-309') +
        '<h2 class="section-h">La paciencia de Dios no es aprobación</h2>' +
        '<p>En los días de Noé, el mensaje se predicó durante ciento veinte años (Gén. 6:3). Al principio la gente pensaría: «Ya habrá tiempo». Luego: «Esto nunca se cumplirá». Hasta que la puerta del arca se cerró. Salomón lo describe así: «Por cuanto no se ejecuta luego sentencia sobre la mala obra, el corazón de los hijos de los hombres está en ellos dispuesto para hacer el mal» (Ecl. 8:11).</p>' +
        v('2 PEDRO 3:9', '«El Señor no retarda su promesa, según algunos la tienen por tardanza, sino que es paciente para con nosotros, no queriendo que ninguno perezca, sino que todos procedan al arrepentimiento.»') +
        q('Ellos se burlaron de los mensajeros de Dios, despreciaron sus palabras y se mofaron de sus profetas. Algo que nosotros nunca haríamos… ¿o sí? ¿Qué formas toma hoy el escarnio, aunque sea sutil?',
          '<p>Hoy rara vez apedreamos a alguien, pero podemos ridiculizar: el chiste sobre «los exagerados de la iglesia», el sarcasmo hacia quien intenta vivir con convicción, el meme que convierte un consejo bíblico en burla, o el comentario despectivo sobre los escritos de Elena de White que nunca hemos leído.</p><p>También es escarnio menospreciar con la indiferencia: oír un sermón pensando en quién lo necesita más que yo. Recuerda que la progresión de 2 Crónicas empieza con la burla; tomarse en serio la voz de Dios empieza por no trivializarla.</p>') +
        q('¿Por qué es peligroso confundir la paciencia de Dios con su aprobación? ¿Cómo debería cambiar nuestra manera de vivir el saber que hoy estamos dentro de un «espacio de misericordia»?',
          '<p>Si las consecuencias no llegan de inmediato, es fácil concluir que a Dios no le importa o que cambió de opinión. Pero la demora es gracia, no permiso. Cada nueva advertencia es una nueva oportunidad.</p><p>La pregunta correcta no es cuántas oportunidades más me dará Dios, sino qué estoy haciendo con la que tengo hoy. «Si oyereis hoy su voz, no endurezcáis vuestros corazones» (Heb. 3:15).</p>')
    },

    /* 6 ---------------- HIPOCRESÍA */
    {
      tag: "Hipocresía",
      title: "Sepulcros adornados",
      html:
        '<p class="lead">¿Alguna vez pensaste, al leer una historia bíblica: «Yo nunca habría hecho eso»? Es una de las formas más peligrosas de rechazar el mensaje de Dios.</p>' +
        v('MATEO 23:29-31', '«¡Ay de vosotros, escribas y fariseos, hipócritas! porque edificáis los sepulcros de los profetas, y adornáis los monumentos de los justos, y decís: Si hubiésemos vivido en los días de nuestros padres, no hubiéramos sido sus cómplices en la sangre de los profetas. Así que dais testimonio contra vosotros mismos, de que sois hijos de aquellos que mataron a los profetas.»') +
        '<p>Los religiosos del tiempo de Jesús conocían la historia y honraban a los profetas muertos con monumentos. Sin embargo, mientras adornaban tumbas, planeaban la muerte de Alguien que era mucho más que un profeta: el Mesías vivo que estaba delante de ellos.</p>' +
        '<p>Querían asociarse con el prestigio de los profetas, pero no con el contenido de sus mensajes. Jesús los comparó con «sepulcros blanqueados, que por fuera, a la verdad, se muestran hermosos, mas por dentro están llenos de huesos de muertos y de toda inmundicia» (Mat. 23:27).</p>' +
        e(['Muchos siguen en las huellas de los fariseos. Reverencian a aquellos que murieron por su fe. Se admiran de la ceguera de los judíos al rechazar a Cristo. Declaran: Si hubiésemos vivido en su tiempo, habríamos recibido gozosamente sus enseñanzas; nunca habríamos participado en la culpa de aquellos que rechazaron al Salvador. Pero cuando la obediencia a Dios requiere abnegación y humillación, estas mismas personas ahogan sus convicciones y se niegan a obedecer. Así manifiestan el mismo espíritu que los fariseos a quienes Cristo condenó.'], 'El Deseado de todas las gentes, pp. 570, 571') +
        '<h2 class="section-h">Admirar la verdad a una distancia segura</h2>' +
        '<p>La hipocresía no es solo aparentar delante de otros. También consiste en ver con claridad los errores de generaciones anteriores mientras permanecemos ciegos a los mismos errores en nosotros (Mat. 7:5). Podemos defender la Biblia, admirar a los pioneros y hablar de obediencia, mientras por dentro resistimos aquello que Dios nos pide cambiar.</p>' +
        '<p>Si hubiéramos crecido en las mismas circunstancias, con la misma familia, los mismos miedos y la misma cultura, probablemente habríamos reaccionado igual que ellos. Por eso la parábola del fariseo y el publicano termina con una sorpresa: el que bajó justificado fue el que oró «Dios, sé propicio a mí, pecador» (Luc. 18:13-14).</p>' +
        q('¿Cómo podemos evitar la hipocresía de parecer religiosos por fuera mientras por dentro resistimos a Dios? ¿Hay algo que defendemos públicamente, pero que en la práctica no estamos dispuestos a obedecer?',
          '<p>El antídoto es la humildad que se deja examinar: permitir que la Palabra nos lea antes de usarla para juzgar a otros (Heb. 4:12). Eso incluye pedir a Dios que nos muestre nuestros puntos ciegos (Sal. 139:23-24) y aceptar la corrección de personas de confianza.</p><p>Ejemplos que pueden surgir: defender la importancia del sábado y pasarlo pegados al celular; citar consejos de salud sin aplicarlos; hablar de la Biblia sin abrirla en la semana. No se trata de vivir con culpa, sino de dejar que la verdad toque nuestra vida real. La verdadera prueba no es lo que imaginamos que habríamos hecho hace siglos, sino cómo respondemos hoy a la verdad que conocemos.</p>')
    },

    /* 7 ---------------- PARA NUESTRA ADVERTENCIA */
    {
      tag: "Para nuestra advertencia",
      title: "Dios no desperdicia palabras",
      html:
        '<p class="lead">¿Por qué la Biblia registra tantas historias de fracaso? Idolatría, incredulidad, inmoralidad, rebelión. ¿No habría sido mejor conservar solo las historias inspiradoras?</p>' +
        v('1 CORINTIOS 10:6, 11-12', '«Mas estas cosas sucedieron como ejemplos para nosotros, para que no codiciemos cosas malas, como ellos codiciaron… Y estas cosas les acontecieron como ejemplo, y están escritas para amonestarnos a nosotros, a quienes han alcanzado los fines de los siglos. Así que, el que piensa estar firme, mire que no caiga.»') +
        '<p>Pablo conecta el antiguo Israel con la iglesia de su tiempo, y con nosotros. Cambian la tecnología y las culturas, pero el corazón humano enfrenta las mismas tentaciones: desconfiar de Dios cuando tenemos miedo, rechazar una verdad que incomoda, preferir nuestros deseos a su voluntad.</p>' +
        '<p>Por eso las historias de fracaso no están ahí para mirar con superioridad a quienes cayeron, sino para mostrarnos lo que puede pasarnos. Un dicho lo resume: el inteligente aprende de sus propios errores; <strong>el sabio aprende de los errores de otros</strong>. Dios preservó esas historias para que no tengamos que aprender cada lección a través de nuestras propias caídas.</p>' +
        '<p>Y junto a la advertencia viene una promesa: «fiel es Dios, que no os dejará ser tentados más de lo que podéis resistir, sino que dará también juntamente con la tentación la salida» (1 Cor. 10:13). No estamos condenados a repetir la historia.</p>' +
        '<h2 class="section-h">Prosperar de verdad</h2>' +
        '<p>«Creed en Jehová vuestro Dios, y estaréis seguros; creed a sus profetas, y seréis prosperados» (2 Crón. 20:20). Algunos miden la prosperidad por la casa, el auto o la estabilidad económica. Dios se preocupa por nuestras necesidades, pero desea sobre todo que prospere nuestra alma (3 Juan 2). Hay hijos fieles de Dios que atraviesan grandes dificultades; prosperar espiritualmente es permanecer cerca de Él, escuchar su voz y obedecer.</p>' +
        e(['Dios trabajará con los que quieren escuchar su voz. La Palabra de Dios debiera ser nuestra consejera, y debiera guiarnos en nuestra experiencia. Las lecciones de la historia del Antiguo Testamento, si se las estudia con fidelidad, nos mostrarán cómo se puede lograr esto…', 'La historia del Antiguo Testamento se registró en beneficio de las generaciones venideras.'], 'Cada día con Dios, 2 de septiembre, p. 252') +
        q('Pablo advierte: «el que piensa estar firme, mire que no caiga». ¿Por qué las caídas más grandes suelen llegar cuando nos sentimos más seguros? ¿Qué lecciones concretas podemos extraer de los relatos de rebelión e incredulidad para no repetirlos?',
          '<p>La confianza en uno mismo baja la guardia. Cuando creemos que sabemos lo suficiente, que tenemos experiencia o conocimiento bíblico, dejamos de depender de Dios. Pedro dijo «aunque todos se escandalicen… yo no» (Mar. 14:29) pocas horas antes de negar a Jesús.</p><p>Algunas lecciones: el miedo no debe tomar las decisiones (Cades-barnea); la Palabra no se edita, se obedece (Joacim); la burla endurece el corazón (Judá); admirar la verdad no es lo mismo que vivirla (los fariseos). El objetivo de estas historias no es vivir con miedo, sino con humildad y vigilancia espiritual.</p>')
    },

    /* 8 ---------------- ELENA G. DE WHITE */
    {
      tag: "Elena G. de White",
      title: "Tanto si se me escucha como si se me silencia",
      html:
        '<p class="lead">Lo que vivieron los profetas bíblicos se repitió en la experiencia de Elena de White. Algunos aceptaban los consejos que Dios enviaba por medio de ella; otros los rechazaban.</p>' +
        '<p>Su nieto Arthur White, quien dirigió el Patrimonio de los Escritos de Elena G. de White, estimó que ella recibió cientos de visiones y sueños proféticos. Algunas visiones fueron públicas y las presenciaron muchas personas, incluso escépticas. En 1868, James White describió que durante una visión ella estaba completamente inconsciente de lo que la rodeaba, no respiraba y tenía los ojos abiertos.</p>' +
        e(['Dios me puso para reprender a su pueblo, y […] considerará a todos aquellos a quienes se proclama este mensaje como responsables del modo en que lo traten. […] Yo no escogí esta desagradable tarea. No me trae la alabanza o el favor de los hombres. […] En nombre de mi Redentor y con su fuerza, haré cuanto pueda. Advertiré, aconsejaré, reprenderé y alentaré tal como dicta el Espíritu de Dios, tanto si se me escucha como si se me silencia.'], 'Testimonios para la iglesia, t. 4, p. 229') +
        '<p>Muchos de los que rechazaron sus mensajes no lo hicieron por razones teológicas, sino por incredulidad o desacuerdos personales con ella. Es el mismo patrón que vimos con Moisés: el conflicto con el mensajero escondía una resistencia al mensaje.</p>' +
        '<p>Sin embargo, ella fue amable con quienes dudaban. Pidió que fueran tratados con <em>«mucha paciencia y amor fraternal […] hasta que encuentren su lugar y adopten una posición en favor o en contra»</em> (Testimonios para la iglesia, t. 1, p. 294). Confiaba en que quien busca sinceramente la verdad la encontrará, porque Dios da evidencias suficientes <em>«para inclinar nuestra fe hacia el lado de la verdad»</em> (Testimonios para la iglesia, t. 4, p. 228).</p>' +
        q('¿Cómo deberíamos tratar hoy a quienes dudan del ministerio de Elena de White o de algún aspecto de la Biblia? ¿Y cómo tratamos nosotros los consejos suyos que nos incomodan?',
          '<p>Con la misma actitud que ella pidió: paciencia, amor fraternal y respeto por el proceso de cada persona. La presión, la burla o la etiqueta de «rebelde» suelen alejar más. Lo que convence es la evidencia, la oración y un testimonio coherente.</p><p>La segunda parte es más incómoda. Es posible citar a Elena de White solo cuando confirma lo que ya pensamos e ignorarla cuando corrige nuestro estilo de vida. Invita a la clase a preguntarse si leen sus escritos para obedecer o solo para tener razón.</p>') +
        '<p class="muted">Para profundizar: Elena de White, «Actitudes acerca de los Testimonios» y «Redacción y distribución de los Testimonios para la iglesia», en Mensajes selectos, t. 1, pp. 47-69.</p>'
    },

    /* 9 ---------------- APLICACIÓN */
    {
      tag: "Aplicación",
      title: "Afinar el dial",
      html:
        '<p class="lead">La señal de Dios es constante. Lo que cambia es nuestra disposición para escucharla. ¿Cómo afinamos el dial?</p>' +
        v('SANTIAGO 1:19, 22', '«Por esto, mis amados hermanos, todo hombre sea pronto para oír, tardo para hablar, tardo para airarse… Pero sed hacedores de la palabra, y no tan solamente oidores, engañándoos a vosotros mismos.»') +
        '<ul class="marks"><li><strong>Cultivar la humildad.</strong> El orgullo es la mayor barrera para escuchar; no nos permite reconocer que podemos estar equivocados. La humildad abre la puerta al cambio y al crecimiento.</li><li><strong>Revisar la raíz de nuestras reacciones.</strong> Antes de responder a un consejo o a un texto que molesta, preguntar: ¿esto es un argumento bíblico o un miedo a perder algo?</li><li><strong>Escuchar a mensajeros inesperados.</strong> A veces Dios habla por medio de un joven, un niño, una mujer o alguien con menos experiencia que nosotros. Ser humilde no es someterse a todo, sino reconocer que podemos aprender de cualquiera.</li><li><strong>Madurar también emocionalmente.</strong> Nuestras heridas y nuestra historia influyen en cómo recibimos la corrección. Ponerlas en manos de Dios, y buscar ayuda cuando haga falta, nos permite escuchar sin sentirnos atacados.</li><li><strong>Obedecer lo que ya sabemos.</strong> La luz que se pone en práctica se amplía; la que se ignora se apaga.</li></ul>' +
        v('MATEO 11:15', '«El que tiene oídos para oír, oiga.»') +
        q('Piensa en tu semana: ¿en qué área concreta sientes que Dios te está diciendo «¡Escucha esto!»? ¿Qué interferencia (una actitud, un hábito, una herida, el orgullo) te está impidiendo oírlo con claridad, y qué paso darás para afinar el dial?',
          '<p>Da tiempo para pensar en silencio y, si el grupo tiene confianza, invita a compartir en parejas. Lo importante es llegar a un paso concreto y pequeño: pedir perdón a alguien, retomar la lectura diaria, aceptar un consejo que se había rechazado, buscar ayuda para sanar una herida.</p><p>Recuerda a la clase que el objetivo no es la culpa, sino la sintonía. Dios no grita para humillarnos; habla porque quiere guiarnos y protegernos.</p>')
    },

    /* 10 ---------------- CIERRE */
    {
      tag: "Cierre",
      title: "Hoy, si oyereis su voz",
      html:
        '<p class="lead">Recibir un mensaje de Dios siempre exige una respuesta. Esta semana vimos varias.</p>' +
        '<ul class="marks"><li>Israel reaccionó con miedo y convirtió su inseguridad en rebelión contra Moisés y Aarón; Caleb respondió con otro espíritu.</li><li>Joacim intentó destruir la Palabra, pero no pudo destruir la verdad ni sus consecuencias.</li><li>Generaciones enteras se burlaron de los mensajeros, hasta que no hubo remedio; la paciencia de Dios no era aprobación.</li><li>Los fariseos honraban a los profetas muertos mientras rechazaban al Mesías vivo.</li><li>Dios preservó también los fracasos para que aprendamos sin tener que caer.</li></ul>' +
        '<p>Detrás de cada mensaje difícil seguía existiendo el mismo propósito: Dios intentaba salvar a su pueblo antes de que llegaran las consecuencias. Él sigue hablando, sigue amando y sigue dando oportunidades. Cada corrección es una invitación a volver a Él.</p>' +
        v('HEBREOS 3:15', '«Entre tanto que se dice: Si oyereis hoy su voz, no endurezcáis vuestros corazones, como en la provocación.»') +
        q('Cuando la Palabra de Dios contradice lo que quieres creer o hacer, ¿la recibes como una amenaza a tu libertad, o como la voz de un Dios que intenta proteger y salvar tu vida? ¿Qué te ayudaría a responder como Caleb y no como los diez espías?',
          '<p>Cierra con una ronda breve de respuestas. Ayuda a la clase a recordar que hay verdades que incomodan especialmente porque tocan preferencias, gustos o costumbres heredadas de la familia. Precisamente ahí es donde más necesitamos confiar en que Dios quiere nuestro bien.</p><p>Termina con una oración pidiendo amar la Palabra de Dios incluso cuando va en contra de nuestros gustos, porque es la manera en que Él nos guarda del dolor, del fracaso y del juicio, y poniendo la vida en armonía con su voluntad.</p>') +
        '<div class="closing-prompt"><p>«Y estas cosas les acontecieron como ejemplo, y están escritas para amonestarnos a nosotros, a quienes han alcanzado los fines de los siglos.» — 1 Corintios 10:11</p></div>'
    }
  ];

  var current = 0;
  var total = pages.length;

  var contentInner = document.getElementById('contentInner');
  var pageTitle = document.getElementById('pageTitle');
  var sectionLabel = document.getElementById('sectionLabel');
  var pageCounterTop = document.getElementById('pageCounterTop');
  var progressFill = document.getElementById('progressFill');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var tocBtn = document.getElementById('tocBtn');
  var tocClose = document.getElementById('tocClose');
  var tocOverlay = document.getElementById('tocOverlay');
  var tocList = document.getElementById('tocList');
  var contentScroll = document.getElementById('contentScroll');

  function buildToc(){
    tocList.innerHTML = '';
    pages.forEach(function(p, i){
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.innerHTML = '<span class="n">' + (i+1).toString().padStart(2,'0') + '</span><span>' + p.title + '</span>';
      if(i === current) btn.classList.add('active');
      btn.addEventListener('click', function(){ goTo(i); closeToc(); });
      li.appendChild(btn);
      tocList.appendChild(li);
    });
  }

  function render(){
    var p = pages[current];
    pageTitle.textContent = p.title;
    sectionLabel.textContent = p.tag;
    pageCounterTop.textContent = (current+1) + ' / ' + total;
    progressFill.style.width = ((current+1)/total*100) + '%';
    contentInner.innerHTML = p.html;
    contentInner.classList.remove('fade-in');
    void contentInner.offsetWidth;
    contentInner.classList.add('fade-in');
    contentScroll.scrollTop = 0;

    prevBtn.disabled = (current === 0);
    if(current === total - 1){ nextBtn.textContent = 'Reiniciar ↺'; }
    else if(current === 0){ nextBtn.textContent = 'Comenzar →'; }
    else { nextBtn.textContent = 'Siguiente ›'; }

    var startBtn = document.getElementById('startBtn');
    if(startBtn){ startBtn.addEventListener('click', function(){ goTo(current+1); }); }

    try{ history.replaceState(null, '', '#p' + (current+1)); }catch(err){}
    buildToc();
  }

  function goTo(i){
    if(i < 0) i = 0;
    if(i > total - 1) i = total - 1;
    current = i;
    render();
  }

  prevBtn.addEventListener('click', function(){ goTo(current - 1); });
  nextBtn.addEventListener('click', function(){
    if(current === total - 1){ goTo(0); } else { goTo(current + 1); }
  });

  tocBtn.addEventListener('click', function(){ tocOverlay.classList.add('open'); });
  tocClose.addEventListener('click', closeToc);
  tocOverlay.addEventListener('click', function(ev){ if(ev.target === tocOverlay) closeToc(); });
  function closeToc(){ tocOverlay.classList.remove('open'); }

  contentInner.addEventListener('click', function(ev){
    var btn = ev.target.closest('.answer-toggle');
    if(!btn) return;
    var panel = document.getElementById(btn.getAttribute('data-answer'));
    if(!panel) return;
    var opening = !panel.classList.contains('open');
    panel.classList.toggle('open');
    btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
    btn.textContent = opening ? 'Ocultar respuesta' : 'Ver respuesta orientativa';
  });

  document.addEventListener('keydown', function(ev){
    if(ev.key === 'Escape'){ closeToc(); return; }
    if(tocOverlay.classList.contains('open')) return;
    if(ev.key === 'ArrowRight') goTo(current+1);
    if(ev.key === 'ArrowLeft') goTo(current-1);
  });

  var tx = null, ty = null;
  contentScroll.addEventListener('touchstart', function(ev){
    tx = ev.changedTouches[0].clientX;
    ty = ev.changedTouches[0].clientY;
  }, {passive:true});
  contentScroll.addEventListener('touchend', function(ev){
    if(tx === null) return;
    var dx = ev.changedTouches[0].clientX - tx;
    var dy = ev.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 2){
      if(dx < 0) goTo(current+1); else goTo(current-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  var start = 0;
  var m = /^#p(\d+)$/.exec(location.hash || '');
  if(m){ start = Math.max(0, Math.min(total-1, parseInt(m[1],10) - 1)); }
  current = start;
  render();
})();
</script>
</body>
</html>
