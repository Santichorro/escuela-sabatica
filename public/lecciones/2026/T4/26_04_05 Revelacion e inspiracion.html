<script>
(function(){

  var qn = 0;

  function v(label, text){
    return '<div class="verse-block"><span class="block-label">' + label + '</span><blockquote>' + text + '</blockquote></div>';
  }
  function e(paras, cite){
    if(typeof paras === 'string'){ paras = [paras]; }
    var inner = paras.map(function(t){ return '<blockquote>' + t + '</blockquote>'; }).join('');
    return '<div class="egw-block"><span class="block-label">ESPÍRITU DE PROFECÍA</span>' + inner + '<cite>' + cite + '</cite></div>';
  }
  function q(question, answer){
    qn++;
    var id = 'a' + qn;
    return '<div class="question-card">' +
      '<span class="question-label">PREGUNTA ' + qn + ' PARA DISCUSIÓN</span>' +
      '<p class="question-text">' + question + '</p>' +
      '<button class="answer-toggle" aria-expanded="false" data-answer="' + id + '">Ver respuesta orientativa</button>' +
      '<div class="answer-panel" id="' + id + '"><span class="who">GUÍA PARA EL MAESTRO</span>' + answer + '</div>' +
    '</div>';
  }

  var pages = [

    /* 0 ---------------- PORTADA */
    {
      tag: "Lección 5 · 4to trimestre 2026",
      title: "Portada",
      html:
        '<div class="cover"><span class="kicker">4TO TRIMESTRE 2026 · LECCIÓN 5</span><h1>Revelación e inspiración</h1><p class="subtitle">Cómo se comunica Dios —por medio de la creación, de su Palabra y de sus profetas— y por qué podemos confiar en que la Biblia es su voz.</p><div class="memory-verse">«La revelación de Jesucristo, que Dios le dio para manifestar a sus siervos lo que debe suceder pronto; y la declaró mediante su ángel a su siervo Juan.»<cite>Apocalipsis 1:1-2 — Texto para memorizar</cite></div><p class="readings"><b>Sábado 31 de octubre de 2026</b></p><button class="start-btn" id="startBtn">Comenzar la clase →</button></div>'
    },

    /* 1 ---------------- PUNTO DE PARTIDA */
    {
      tag: "Punto de partida",
      title: "Apertura",
      html:
        '<p class="lead">Imagina que alguien te entrega un mensaje de una persona que nunca has visto. ¿Cómo sabrías que es auténtico? ¿Que no fue alterado en el camino? ¿Que quien lo trajo no le añadió nada propio?</p>' +
        '<p>Eso mismo es lo que está en juego cuando abrimos la Biblia. No preguntamos solo <em>qué</em> dice, sino <em>de dónde viene</em> y <em>por qué podemos confiar en ella</em>.</p>' +
        v('APOCALIPSIS 1:1-2 (TEXTO PARA MEMORIZAR)', '«La revelación de Jesucristo, que Dios le dio para manifestar a sus siervos lo que debe suceder pronto; y la declaró mediante su ángel a su siervo Juan.»') +
        '<p>Juan, anciano y desterrado en Patmos, es el último eslabón de una cadena: Dios Padre, Jesucristo, el ángel, Juan, las iglesias. Hoy recorreremos esa cadena para entender cómo Dios se comunica y por qué lo hace.</p>' +
        q('Si Dios pudiera hablarte hoy de la forma que quisiera, ¿cómo crees que lo haría? ¿Por qué crees que eligió hacerlo mediante personas?',
          '<p>Deje que varios respondan antes de revelar. Idea central: Dios eligió a humanos porque su mensaje no es solo información, es relación. Por medio de Jesús, «el Verbo hecho carne», ya había mostrado que su método es la encarnación: lo divino expresado en lo humano. La Biblia sigue ese mismo patrón.</p>')
    },

    /* 2 ---------------- DOS LIBROS: NATURALEZA Y ESCRITURA */
    {
      tag: "Dos libros: naturaleza y Escritura",
      title: "Dos libros que hablan de Dios",
      html:
        '<p class="lead">Dios habla de dos maneras complementarias. La primera es la <strong>revelación general</strong>: la creación.</p>' +
        v('SALMO 19:1', '«Los cielos cuentan la gloria de Dios, y el firmamento anuncia la obra de sus manos.»') +
        v('ROMANOS 1:20', '«Los atributos invisibles de Dios, su eterno poder y su divinidad, se ven claramente desde la creación del mundo.»') +
        '<p>La naturaleza nos habla de poder, orden y cuidado. Pero también guarda sombras: espinos, enfermedad, depredación, muerte. Un mismo bosque puede mostrar un Creador bueno… y un mundo herido. ¿Cómo interpretar ese mensaje ambiguo?</p>' +
        '<p>Ahí entra la <strong>revelación especial</strong>: Jesucristo y la Biblia que da testimonio de él (Juan 5:39). Solo la Escritura explica el origen del mal, el plan de redención y el final de la historia.</p>' +
        e('«“Dios es amor” está escrito en cada capullo de flor que se abre, en cada tallo de la naciente hierba.»', 'Elena G. de White, El camino a Cristo, p. 9') +
        '<p>Observa el equilibrio: la naturaleza escribe «Dios es amor» con tinta de flores; la Palabra lo explica con palabras y con una cruz.</p>' +
        q('Hay personas que dicen sentirse más cerca de Dios en un bosque que en una iglesia. ¿Qué tiene de cierto esa idea y qué le falta?',
          '<p>Es cierto que la creación revela a Dios (Rom. 1:20). Le falta que no responde a las preguntas decisivas: ¿por qué sufrimos?, ¿cómo se perdona el pecado?, ¿qué hay después de la muerte? La naturaleza señala al Creador; la Escritura y Cristo nos dicen quién es y qué hizo por nosotros. Ambas se necesitan.</p>')
    },

    /* 3 ---------------- INSPIRACIÓN */
    {
      tag: "Inspiración",
      title: "¿Qué hace diferente a la Biblia?",
      html:
        '<p class="lead">Existen millones de libros religiosos, filosóficos y morales. Hebreos 1:1-2 afirma que Dios habló «muchas veces y de muchas maneras» por los profetas, y por fin «por el Hijo». La Biblia no es una biblioteca de ideas humanas sobre Dios: es el registro de Dios hablando.</p>' +
        v('2 TIMOTEO 3:16', '«Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia.»') +
        v('SANTIAGO 1:17', '«Toda buena dádiva y todo don perfecto desciende de lo alto, del Padre de las luces, en el cual no hay mudanza.»') +
        '<h2 class="section-h">Qué es la inspiración</h2>' +
        '<p>Es la asistencia del Espíritu Santo a los profetas genuinos para que comunicaran con fidelidad los mensajes divinos, tanto al <em>recibirlos</em> como al <em>transmitirlos</em>.</p>' +
        '<p>Dios usó sueños y visiones (Núm. 12:6; Isa. 6), testigos oculares (1 Juan 1:1-3), investigación histórica guiada por el Espíritu (Luc. 1:1-3) e impresiones en la mente (2 Ped. 1:21).</p>' +
        '<h2 class="section-h">Un punto clave</h2>' +
        '<p>Los profetas usaron <strong>sus propias palabras</strong>, pero el mensaje no fue alterado ni distorsionado. Por eso cada libro tiene el estilo de su autor, sin que haya «grados» de inspiración.</p>' +
        q('Si los escritores bíblicos usaron sus propias palabras y estilo, ¿cómo podemos estar seguros de que el mensaje sigue siendo de Dios?',
          '<p>Porque la inspiración actúa sobre los pensamientos y el mensaje, no solo sobre las palabras (2 Ped. 1:21: «inspirados por el Espíritu Santo»). Piensa en un buen intérprete: usa su voz y su acento, pero lleva fielmente el mensaje. Además, la unidad de la Biblia, escrita por unos cuarenta autores a lo largo de siglos, apunta a una sola Mente detrás.</p>')
    },

    /* 4 ---------------- MENSAJES ORALES */
    {
      tag: "Mensajes orales",
      title: "Cuando Dios habla en voz alta",
      html:
        '<p class="lead">La primera forma de comunicación fue oral. Dios habló con Adán y Eva antes y después de la caída (Gén. 2:16-17; 3:9-19), y ellos entendieron cada palabra. Su voz resonó en el Sinaí (Éx. 20), en el bautismo y en la transfiguración de Jesús.</p>' +
        v('2 PEDRO 1:21', '«Nunca la profecía fue traída por voluntad humana, sino que los santos hombres de Dios hablaron siendo inspirados por el Espíritu Santo.»') +
        '<p>Muchos profetas jamás escribieron un libro: Noé, Natán, Elías, Eliseo, Juan el Bautista. Su palabra no fue menos inspirada. Jesús mismo no dejó un solo escrito (solo trazó en el suelo, Juan 8:6) y enseñaba «con autoridad» (Mat. 7:29).</p>' +
        '<p>Natán llegó ante un rey poderoso con un mensaje incómodo: «Tú eres aquel hombre». Fue un mensaje oral, pero tan vinculante que David respondió: «Pequé contra Jehová».</p>' +
        e('«Todo daño o agravio que se haga a otros se extiende del perjudicado a Dios.»', 'Elena G. de White, Historia de los patriarcas y profetas, pp. 780-782') +
        q('Algunos profetas no tienen libro en la Biblia. ¿Por qué eso no les quita autoridad? ¿Qué nos enseña sobre cómo Dios define la autoridad?',
          '<p>La autoridad viene de quién habla, no del formato. Un mensaje divino es válido sea hablado o escrito. El canon recoge lo que Dios quiso preservar para todas las generaciones, pero no mide cuánto habló. Aplicación: no despreciemos un consejo bíblico porque venga en forma de una conversación sencilla; Dios aún usa voces humanas.</p>') +
        q('¿Por qué crees que Dios envió a Natán en lugar de dejar que David descubriera su pecado solo?',
          '<p>David llevaba cerca de un año sin confesar (Sal. 32:3-5). Un corazón endurecido no se corrige por sí mismo. Dios usó una parábola (la oveja del pobre) para sortear las defensas del rey. Todos tenemos puntos ciegos; necesitamos Palabra externa y personas fieles que nos hablen con verdad y amor.</p>')
    },

    /* 5 ---------------- MENSAJES ESCRITOS */
    {
      tag: "Mensajes escritos",
      title: "Por qué Dios pidió escribir",
      html:
        '<p class="lead">Las palabras habladas se desvanecen o se distorsionan. Por eso Dios ordenó a Moisés: «Escribe esto para memoria en un libro» (Éx. 17:14). Desde entonces, el Espíritu guio a los profetas hasta completar los 66 libros.</p>' +
        v('1 CORINTIOS 10:11', '«Estas cosas les acontecieron como ejemplo, y están escritas para amonestarnos a nosotros, a quienes han alcanzado los fines de los siglos.»') +
        v('JUAN 20:31', '«Estas se han escrito para que creáis que Jesús es el Cristo, el Hijo de Dios, y para que creyendo, tengáis vida en su nombre.»') +
        '<h2 class="section-h">Razones para escribir</h2>' +
        '<ul class="marks"><li><strong>Memoria:</strong> preservar lo que Dios hizo y dijo (Éx. 17:14).</li><li><strong>Fe:</strong> llevar a las personas a Cristo y a la vida (Juan 20:31).</li><li><strong>Advertencia y ejemplo:</strong> aprender de aciertos y errores ajenos (1 Cor. 10:11).</li><li><strong>Futuro:</strong> alcanzar a quienes no estuvieron presentes (Apoc. 1:19).</li></ul>' +
        '<p>Hay algo conmovedor: la Biblia no maquilla a sus héroes. Abraham miente, David cae, Pedro niega.</p>' +
        e('«Es alentador para nuestro corazón abatido saber que por la gracia de Dios ellos pudieron obtener nuevo vigor para levantarse por encima de su naturaleza mala.»', 'Elena G. de White, Conflicto y valor, 1.º de enero, p. 7') +
        q('La Biblia incluye pecados de sus personajes, e incluso palabras de Satanás (Gén. 3:1-5). ¿Significa que Dios aprueba todo lo que registra? ¿Cómo distinguimos entre lo que se <em>describe</em> y lo que se <em>enseña</em>?',
          '<p>No. Registrar no es aprobar. Para distinguir: ¿qué dice el contexto y el resto de la Escritura?, ¿cómo evalúa Dios el hecho (consecuencias, reproche, arrepentimiento)?, ¿qué principio aparece en las enseñanzas directas? La honestidad de la Biblia es una evidencia de autenticidad: una historia inventada habría ocultado las caídas de sus héroes.</p>')
    },

    /* 6 ---------------- MENSAJES REPRESENTADOS */
    {
      tag: "Mensajes representados",
      title: "Cuando el mensaje se actúa",
      html:
        '<p class="lead">A veces las palabras no bastan. Dios pidió a sus profetas que <em>vivieran</em> el mensaje. Ezequiel dibujó Jerusalén en un adobe, la sitió con maquetas y estuvo acostado 390 días sobre un lado y 40 sobre el otro (Eze. 4:1-8). Oseas se casó con Gomer para mostrar la infidelidad de Israel y la fidelidad de Dios (Ose. 1:2-9).</p>' +
        '<p>Pensemos en los símbolos que Dios usó: el santuario (Heb. 8:1-6), las estatuas y bestias de Daniel (Dan. 2; 7; 8), Jesús como Pan de Vida, Luz del mundo y Vid verdadera (Juan 6; 8; 15).</p>' +
        e('«Empleó ilustraciones en su enseñanza que despertaban los recuerdos y simpatías más puros para así poder alcanzar el templo interior del alma.»', 'Elena G. de White, El Cristo triunfante, 6 de agosto, p. 227') +
        '<p>Las representaciones impactan porque se recuerdan: una cosa es oír que Dios sufre por su pueblo, y otra ver a un profeta atado durante meses.</p>' +
        v('APOCALIPSIS 3:15, 18', '«Yo conozco tus obras, que ni eres frío ni caliente… Por tanto, yo te aconsejo que de mí compres oro refinado en fuego… y unge tus ojos con colirio, para que veas.»') +
        q('Si Dios quisiera advertirnos hoy sobre la condición laodicense, ¿qué «representación» podría usar? ¿Qué hace tibia a una persona o a una iglesia?',
          '<p>Respuestas abiertas. Laodicea se sentía rica y no necesitaba nada (Apoc. 3:17). Hoy sería la comodidad, la rutina religiosa sin relación, el consumo constante de información sin obediencia. Dios no los rechaza: ofrece oro, vestiduras y colirio, es decir, fe, justicia de Cristo y discernimiento del Espíritu. La advertencia es misericordia.</p>')
    },

    /* 7 ---------------- ELENA G. DE WHITE */
    {
      tag: "Elena G. de White",
      title: "Elena G. de White y la inspiración",
      html:
        '<p class="lead">Los adventistas creemos que Elena de White fue una verdadera profeta, con la misma clase de inspiración que los profetas bíblicos, pero sin igualar sus escritos a la Biblia. Ella siempre exaltó la Escritura como la revelación autoritativa e infalible de Dios.</p>' +
        e('«No son las palabras de la Biblia las inspiradas, sino los hombres son los que fueron inspirados. La inspiración no obra en las palabras del hombre ni en sus expresiones, sino en el hombre mismo.»', 'Elena G. de White, Mensajes selectos, t. 1, p. 24') +
        e('«Hay oportunidades cuando deben declararse cosas comunes… Tales palabras, tal información, no son dadas bajo la inspiración especial del Espíritu de Dios.»', 'Elena G. de White, Mensajes selectos, t. 1, pp. 45-46') +
        '<p>Esta distinción protege de dos extremos: rechazar todo lo que escribió o tratar cada carta y cada diario como si fuera una revelación.</p>' +
        '<h2 class="section-h">Cómo leerla bien</h2>' +
        '<ul class="marks"><li>La Biblia es la norma; los escritos de Elena de White la iluminan y aplican.</li><li>Debemos leer su contexto: época, destinatarios, propósito.</li><li>Su mensaje apunta a Cristo y a la Escritura, no a sí misma.</li></ul>' +
        q('¿Qué peligros hay si tratamos cada línea de un escritor inspirado como si fuera un mandato universal, o si descartamos todo lo que no entendemos?',
          '<p>El primero produce legalismo y rigidez; el segundo, escepticismo. La actitud correcta combina humildad y discernimiento: estudiar el contexto, comparar con la Escritura (Hech. 17:11) y pedir la luz del Espíritu. Jesús mismo advirtió contra tergiversar la Palabra (Mar. 12:24).</p>')
    },

    /* 8 ---------------- APLICACIÓN */
    {
      tag: "Aplicación",
      title: "Vivir bajo una Palabra inspirada",
      html:
        '<p class="lead">Una Palabra inspirada exige una respuesta. Tres enfoques para esta semana:</p>' +
        '<h2 class="section-h">Estudiarla con humildad</h2>' +
        '<p>«Dificultades» en la Biblia no son una debilidad; son la señal de que Dios es mayor que nuestra mente. Elena de White señala que debemos acercarnos «con espíritu humilde y dócil» (El conflicto de los siglos, p. 584).</p>' +
        '<h2 class="section-h">Rodearnos de voces adecuadas</h2>' +
        '<p>Vivimos saturados de opiniones, algoritmos y noticias. Si todo es «información», ¿qué lugar ocupa la voz de Dios? Decide un momento diario sin pantallas para escuchar su Palabra.</p>' +
        '<h2 class="section-h">Compartirla de forma comprensible</h2>' +
        '<p>Dios habló en lenguaje humano. Nosotros también podemos usar historias, imágenes, un gesto de servicio, para que otros entiendan su amor.</p>' +
        e('«Cuanto más escudriña [la Biblia], tanto más se profundiza su convicción de que es la Palabra del Dios vivo.»', 'Elena G. de White, El camino a Cristo, pp. 106-108') +
        q('¿Qué hábito concreto puedes cambiar esta semana para que la Biblia deje de ser «un libro más» y se convierta en la voz de Dios para ti?',
          '<p>Guíe hacia compromisos concretos y pequeños: leer un capítulo antes del celular, orar antes de abrir la Biblia, anotar un versículo y compartirlo con alguien, estudiar en pareja o en familia. Mejor un paso real que una promesa grandiosa.</p>')
    },

    /* 9 ---------------- CIERRE */
    {
      tag: "Cierre",
      title: "La cadena sigue abierta",
      html:
        '<p class="lead">Dios Padre habló al Hijo, el Hijo al ángel, el ángel a Juan, Juan a las iglesias… y la cadena llega hasta ti. No eres un espectador: eres el siguiente destinatario del mensaje.</p>' +
        '<ul class="marks"><li>Dios se comunica porque quiere que lo conozcamos y confiemos en él.</li><li>Usó voces, escritos y representaciones para alcanzarnos.</li><li>La inspiración une lo divino y lo humano sin perder la verdad.</li><li>La respuesta adecuada es la fe obediente.</li></ul>' +
        v('2 PEDRO 1:19', '«Tenemos también la palabra profética más segura, a la cual hacéis bien en estar atentos como a una antorcha que alumbra en lugar oscuro.»') +
        '<p>Cerremos con una oración sencilla: pedir al Espíritu que, así como inspiró la Palabra, nos ayude a entenderla y vivirla.</p>' +
        q('Si tuvieras que explicar a un amigo en una sola frase por qué confías en la Biblia, ¿qué dirías?',
          '<p>Anime respuestas personales. Ejemplo: «Confío en ella porque es coherente, porque me ha cambiado y porque me presenta a Jesús, quien cumple lo que prometió.»</p>') +
        '<div class="closing-prompt"><p>«La revelación de Jesucristo, que Dios le dio para manifestar a sus siervos lo que debe suceder pronto; y la declaró mediante su ángel a su siervo Juan.» — Apocalipsis 1:1-2</p></div>'
    }
  ];

  var current = 0;
  var total = pages.length;

  var contentInner = document.getElementById('contentInner');
  var pageTitle = document.getElementById('pageTitle');
  var sectionLabel = document.getElementById('sectionLabel');
  var pageCounterTop = document.getElementById('pageCounterTop');
  var progressFill = document.getElementById('progressFill');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var tocBtn = document.getElementById('tocBtn');
  var tocClose = document.getElementById('tocClose');
  var tocOverlay = document.getElementById('tocOverlay');
  var tocList = document.getElementById('tocList');
  var contentScroll = document.getElementById('contentScroll');

  function buildToc(){
    tocList.innerHTML = '';
    pages.forEach(function(p, i){
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.innerHTML = '<span class="n">' + (i+1).toString().padStart(2,'0') + '</span><span>' + p.title + '</span>';
      if(i === current) btn.classList.add('active');
      btn.addEventListener('click', function(){ goTo(i); closeToc(); });
      li.appendChild(btn);
      tocList.appendChild(li);
    });
  }

  function render(){
    var p = pages[current];
    pageTitle.textContent = p.title;
    sectionLabel.textContent = p.tag;
    pageCounterTop.textContent = (current+1) + ' / ' + total;
    progressFill.style.width = ((current+1)/total*100) + '%';
    contentInner.innerHTML = p.html;
    contentInner.classList.remove('fade-in');
    void contentInner.offsetWidth;
    contentInner.classList.add('fade-in');
    contentScroll.scrollTop = 0;

    prevBtn.disabled = (current === 0);
    if(current === total - 1){ nextBtn.textContent = 'Reiniciar ↺'; }
    else if(current === 0){ nextBtn.textContent = 'Comenzar →'; }
    else { nextBtn.textContent = 'Siguiente ›'; }

    var startBtn = document.getElementById('startBtn');
    if(startBtn){ startBtn.addEventListener('click', function(){ goTo(current+1); }); }

    try{ history.replaceState(null, '', '#p' + (current+1)); }catch(err){}
    buildToc();
  }

  function goTo(i){
    if(i < 0) i = 0;
    if(i > total - 1) i = total - 1;
    current = i;
    render();
  }

  prevBtn.addEventListener('click', function(){ goTo(current - 1); });
  nextBtn.addEventListener('click', function(){
    if(current === total - 1){ goTo(0); } else { goTo(current + 1); }
  });

  tocBtn.addEventListener('click', function(){ tocOverlay.classList.add('open'); });
  tocClose.addEventListener('click', closeToc);
  tocOverlay.addEventListener('click', function(ev){ if(ev.target === tocOverlay) closeToc(); });
  function closeToc(){ tocOverlay.classList.remove('open'); }

  contentInner.addEventListener('click', function(ev){
    var btn = ev.target.closest('.answer-toggle');
    if(!btn) return;
    var panel = document.getElementById(btn.getAttribute('data-answer'));
    if(!panel) return;
    var opening = !panel.classList.contains('open');
    panel.classList.toggle('open');
    btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
    btn.textContent = opening ? 'Ocultar respuesta' : 'Ver respuesta orientativa';
  });

  document.addEventListener('keydown', function(ev){
    if(ev.key === 'Escape'){ closeToc(); return; }
    if(tocOverlay.classList.contains('open')) return;
    if(ev.key === 'ArrowRight') goTo(current+1);
    if(ev.key === 'ArrowLeft') goTo(current-1);
  });

  var tx = null, ty = null;
  contentScroll.addEventListener('touchstart', function(ev){
    tx = ev.changedTouches[0].clientX;
    ty = ev.changedTouches[0].clientY;
  }, {passive:true});
  contentScroll.addEventListener('touchend', function(ev){
    if(tx === null) return;
    var dx = ev.changedTouches[0].clientX - tx;
    var dy = ev.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 2){
      if(dx < 0) goTo(current+1); else goTo(current-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  var start = 0;
  var m = /^#p(\d+)$/.exec(location.hash || '');
  if(m){ start = Math.max(0, Math.min(total-1, parseInt(m[1],10) - 1)); }
  current = start;
  render();
})();
</script>
</body>
</html>
