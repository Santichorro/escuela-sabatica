<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Creador habla — Lección 1</title>
<style>
  :root{
    --bg: #181517;
    --text: #FBFBFF;
    --accent: #FF331F;

    --on-accent: var(--bg);
    --bg-elevated: color-mix(in srgb, var(--text) 4%, var(--bg));
    --bg-elevated-2: color-mix(in srgb, var(--text) 2.5%, var(--bg));
    --line: color-mix(in srgb, var(--text) 12%, transparent);
    --text-muted: color-mix(in srgb, var(--text) 66%, transparent);
    --text-faint: color-mix(in srgb, var(--text) 35%, transparent);
    --accent-dim: color-mix(in srgb, var(--accent) 16%, transparent);
    --accent-line: color-mix(in srgb, var(--accent) 40%, transparent);

    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --maxw: 640px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  h1,h2,h3{ font-family:var(--serif); font-weight:700; margin:0 0 .6em; }
  p{ margin:0 0 1.1em; }
  ::selection{ background:var(--accent); color:var(--bg); }
  button{ font-family:var(--sans); cursor:pointer; }

  .app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }

  /* ---------- HEADER ---------- */
  .app-header{
    flex:0 0 auto;
    padding:14px 18px 12px;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    z-index:5;
  }
  .header-row{
    max-width:var(--maxw);
    margin:0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .eyebrow{
    display:block;
    font-size:.72rem;
    letter-spacing:.06em;
    color:var(--accent);
    font-weight:600;
    margin-bottom:2px;
  }
  .page-title{ font-size:1.08rem; line-height:1.25; margin:0; }
  .page-counter{
    flex:0 0 auto;
    font-size:.78rem;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    padding-top:2px;
  }
  .progress-track{
    max-width:var(--maxw);
    margin:10px auto 0;
    height:4px;
    background:rgba(254,248,236,0.1);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:4px;
    transition:width .35s ease;
  }

  /* ---------- MAIN CONTENT ---------- */
  .content-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .content-inner{ max-width:var(--maxw); margin:0 auto; padding:26px 20px 56px; }
  .content-inner.fade-in{ animation:fadeIn .32s ease; }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .lead{ font-family:var(--serif); font-size:1.18rem; line-height:1.6; color:var(--text); }
  .content-inner p{ font-size:1.02rem; line-height:1.75; color:var(--text); }
  .content-inner p.muted{ color:var(--text-muted); }
  .content-inner h2.section-h{ font-size:1.3rem; line-height:1.3; margin-top:.2em; }

  /* portada */
  .cover{ min-height:calc(100dvh - 160px); display:flex; flex-direction:column; justify-content:center; }
  .cover .kicker{ color:var(--accent); font-size:.8rem; letter-spacing:.08em; font-weight:600; margin-bottom:14px; }
  .cover h1{ font-size:2.1rem; line-height:1.15; margin-bottom:10px; }
  .cover .subtitle{ color:var(--text-muted); font-size:1rem; margin-bottom:28px; }
  .memory-verse{
    border-left:3px solid var(--accent);
    padding:4px 0 4px 18px;
    font-family:var(--serif);
    font-style:italic;
    font-size:1.12rem;
    line-height:1.55;
    margin-bottom:28px;
  }
  .memory-verse cite{ display:block; font-style:normal; font-size:.85rem; color:var(--accent); margin-top:8px; }
  .start-btn{
    align-self:flex-start;
    background:var(--accent);
    color:#1C0D1B;
    border:none;
    padding:14px 26px;
    border-radius:30px;
    font-size:1rem;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .start-btn:active{ transform:scale(.98); }

  /* verse + egw blocks */
  .verse-block, .egw-block{ background:var(--bg-elevated); border-radius:14px; padding:18px 18px 16px; margin:20px 0; }
  .verse-block{ border-left:4px solid var(--accent); }
  .egw-block{ border-left:4px solid rgba(254,248,236,0.35); background:var(--bg-elevated-2); }
  .block-label{ display:block; font-size:.7rem; letter-spacing:.08em; font-weight:700; color:var(--accent); margin-bottom:8px; }
  .egw-block .block-label{ color:var(--text-muted); }
  .verse-block blockquote, .egw-block blockquote{ margin:0; font-family:var(--serif); font-style:italic; font-size:1.04rem; line-height:1.6; }
  .verse-block cite, .egw-block cite{ display:block; font-style:normal; font-family:var(--sans); font-size:.84rem; color:var(--text-muted); margin-top:10px; }

  ul.marks{ list-style:none; margin:18px 0; padding:0; }
  ul.marks li{ position:relative; padding:0 0 14px 24px; font-size:1.02rem; line-height:1.6; }
  ul.marks li::before{ content:"—"; position:absolute; left:0; color:var(--accent); font-weight:700; }
  ul.marks li strong{ color:var(--text); }

  /* question cards */
  .question-card{ margin:26px 0 10px; background:var(--accent-dim); border:1px solid var(--accent-line); border-radius:16px; padding:18px; }
  .question-label{ display:block; font-size:.7rem; letter-spacing:.08em; font-weight:700; color:var(--accent); margin-bottom:8px; }
  .question-text{ font-family:var(--serif); font-size:1.08rem; line-height:1.5; margin:0 0 14px; }
  .answer-toggle{ background:transparent; border:1.5px solid var(--accent); color:var(--accent); padding:9px 16px; border-radius:22px; font-size:.86rem; font-weight:700; }
  .answer-toggle:active{ transform:scale(.98); }
  .answer-panel{ display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--accent-line); }
  .answer-panel.open{ display:block; }
  .answer-panel .who{ font-size:.72rem; letter-spacing:.06em; font-weight:700; color:var(--text-muted); display:block; margin-bottom:6px; }
  .answer-panel p{ font-size:.98rem; line-height:1.65; color:var(--text); margin-bottom:0; }

  .closing-prompt{ margin-top:30px; padding:18px; border-radius:16px; background:var(--bg-elevated); text-align:center; }
  .closing-prompt p{ margin-bottom:0; color:var(--text-muted); font-size:.95rem; }

  /* ---------- FOOTER NAV ---------- */
  .app-footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .app-footer > *{ flex:0 0 auto; }
  .nav-btn{
    flex:1 1 auto;
    background:var(--bg-elevated);
    color:var(--text);
    border:1px solid var(--line);
    padding:13px 10px;
    border-radius:14px;
    font-size:.92rem;
    font-weight:600;
    text-align:center;
  }
  .nav-btn.nav-btn--primary{ background:var(--accent); color:#1C0D1B; border-color:var(--accent); }
  .nav-btn:disabled{ opacity:.35; }
  .nav-btn:active:not(:disabled){ transform:scale(.98); }
  .toc-btn{
    flex:0 0 46px; height:46px;
    background:transparent; color:var(--text);
    border:1px solid var(--line); border-radius:14px;
    font-size:1.15rem; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- TOC OVERLAY ---------- */
  .toc-overlay{
    position:fixed; inset:0;
    background:rgba(10,4,9,0.72);
    backdrop-filter:blur(2px);
    display:none; align-items:flex-end;
    z-index:20;
  }
  .toc-overlay.open{ display:flex; }
  .toc-panel{
    width:100%; max-height:80vh;
    background:var(--bg);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    overflow-y:auto;
    animation:slideUp .28s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .toc-head{
    display:flex; justify-content:space-between; align-items:center;
    max-width:var(--maxw); margin:0 auto 8px;
    padding:6px 4px 12px;
    font-family:var(--serif); font-size:1.1rem;
    border-bottom:1px solid var(--line);
  }
  .toc-head button{ background:none; border:none; color:var(--text-muted); font-size:1.3rem; line-height:1; }
  #tocList{ list-style:none; margin:0; padding:0; max-width:var(--maxw); margin:0 auto; }
  #tocList li button{
    width:100%; text-align:left;
    background:none; border:none;
    border-bottom:1px solid var(--line);
    color:var(--text); padding:14px 4px;
    font-size:.98rem; display:flex; gap:12px; align-items:baseline;
  }
  #tocList li button .n{ color:var(--accent); font-weight:700; font-size:.85rem; flex:0 0 auto; }
  #tocList li button.active{ color:var(--accent); }

  @media (min-width: 760px){
    :root{ --maxw: 700px; }
    .cover h1{ font-size:2.6rem; }
    .lead{ font-size:1.28rem; }
    .content-inner{ padding:44px 24px 70px; }
    .page-title{ font-size:1.2rem; }
    .app-footer{ padding-bottom:16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .content-inner.fade-in, .toc-panel{ animation:none; }
    .progress-fill{ transition:none; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="header-row">
      <div>
        <span class="eyebrow" id="sectionLabel">Página 1 de 10</span>
        <h1 class="page-title" id="pageTitle">Portada</h1>
      </div>
      <span class="page-counter" id="pageCounterTop"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>

  <div class="content-scroll" id="contentScroll">
    <div class="content-inner" id="contentInner"></div>
  </div>

  <footer class="app-footer">
    <button class="nav-btn" id="prevBtn">‹ Anterior</button>
    <button class="toc-btn" id="tocBtn" aria-label="Índice">≡</button>
    <button class="nav-btn nav-btn--primary" id="nextBtn">Siguiente ›</button>
  </footer>

  <div class="toc-overlay" id="tocOverlay">
    <div class="toc-panel">
      <div class="toc-head">
        <span>Índice de la lección</span>
        <button id="tocClose" aria-label="Cerrar">✕</button>
      </div>
      <ul id="tocList"></ul>
    </div>
  </div>

</div>

<script>
(function(){

  var pages = [
    {
      tag: "Lección 1 · 4to trimestre 2026",
      title: "Portada",
      html:
        '<div class="cover">' +
          '<span class="kicker">4TO TRIMESTRE 2026 · LECCIÓN 1</span>' +
          '<h1>El Creador habla</h1>' +
          '<p class="subtitle">Un estudio de Génesis 1 a 3, sobre la comunión original con Dios, la ruptura del pecado y las muchas formas en que él sigue hablando.</p>' +
          '<div class="memory-verse">' +
            '«En el pasado, Dios habló muchas veces y de muchas maneras a nuestros padres mediante los profetas; pero en estos últimos días nos habló por su Hijo, a quien constituyó heredero de todo, por medio de quien hizo el universo.»' +
            '<cite>Hebreos 1:1-2 — Texto para memorizar</cite>' +
          '</div>' +
          '<button class="start-btn" id="startBtn">Comenzar el estudio →</button>' +
        '</div>'
    },
    {
      tag: "Diseño original",
      title: "Hechos para la comunión",
      html:
        '<p class="lead">Antes de pecar, Adán y Eva no tenían que "buscar" a Dios: él formaba parte de su rutina diaria, tan natural como respirar.</p>' +
        '<p>Caminaban con él «a la brisa del atardecer» (Gén. 3:8), y el día de reposo —parte misma de la semana de la creación— era un tiempo especialmente apartado para esa comunión (Gén. 2:2-3).</p>' +
        '<p>Esto revela algo esencial sobre quiénes somos: fuimos creados «a imagen de Dios» (Gén. 1:27), y esa imagen incluye la <strong>capacidad relacional</strong>. No es un atributo añadido a nuestra humanidad: es parte de su núcleo. Por eso Dios mismo observó que «no es bueno que el hombre esté solo» (Gén. 2:18) incluso antes de que existiera el pecado.</p>' +
        '<div class="verse-block"><span class="block-label">GÉNESIS 1:27-28</span><blockquote>«Y creó Dios al hombre a su imagen, a imagen de Dios lo creó; varón y hembra los creó. Y los bendijo Dios, y les dijo: Fructificad y multiplicaos; llenad la tierra, y sojuzgadla.»</blockquote></div>' +
        '<p class="muted">Vivimos, paradójicamente, en la era con más herramientas de comunicación de toda la historia humana, y al mismo tiempo en medio de una creciente "epidemia de soledad". Tener mil formas de contacto no es lo mismo que tener comunión real. Dios diseñó algo más profundo que el intercambio de mensajes: diseñó presencia.</p>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">Vivimos en una época con más formas de "conectarnos" que nunca y, sin embargo, se habla de una creciente epidemia de soledad. ¿Por qué crees que tener más canales de comunicación no ha resuelto, e incluso ha empeorado, nuestra necesidad real de comunión?</p>' +
          '<button class="answer-toggle" data-answer="a1">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a1"><span class="who">GUÍA PARA EL MAESTRO</span><p>La comunicación mediada por pantallas puede simular cercanía sin ofrecer la vulnerabilidad y presencia plena que el diseño original de Dios incluía —comunión «cara a cara», caminar juntos «a la brisa del atardecer»—. La cantidad de contactos no sustituye la calidad de la presencia. Invita a la clase a distinguir entre conexión superficial y comunión genuina, y a pensar en alguien con quien practicar esta semana una presencia más plena.</p></div>' +
        '</div>'
    },
    {
      tag: "La caída",
      title: "La ruptura: mentira, vergüenza y escondite",
      html:
        '<p class="lead">La serpiente no le dijo a Eva una mentira burda. Retorció la verdad con precisión quirúrgica.</p>' +
        '<p>«¿Conque Dios os ha dicho...?» (Gén. 3:1), sembrando duda sobre la Palabra; luego «No moriréis» (v. 4), negando la consecuencia; y finalmente «Seréis como Dios» (v. 5), ofreciendo una falsa promesa de plenitud. Eva miró el árbol y lo encontró «bueno para comer», «agradable a los ojos» y «codiciable para alcanzar sabiduría» (v. 6): tres deseos legítimos, desconectados de la obediencia.</p>' +
        '<p>El resultado inmediato no fue sabiduría, sino vergüenza: «conocieron que estaban desnudos» (v. 7), y la primera reacción humana fue esconderse de Dios «entre los árboles del huerto» (v. 8). Es, literalmente, absurdo —nadie puede ocultarse del Dios que «llena el cielo y la tierra» (Jer. 23:24)— pero el pecado produce ese reflejo irracional de ocultamiento.</p>' +
        '<div class="egw-block"><span class="block-label">ESPÍRITU DE PROFECÍA</span><blockquote>«El hombre estaba dotado originalmente de facultades nobles y de un entendimiento bien equilibrado. Era perfecto y estaba en armonía con Dios... Pero por la desobediencia, sus facultades se pervirtieron y el egoísmo reemplazó el amor.»</blockquote><cite>El camino a Cristo, pp. 17, 18</cite></div>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">Satanás no le dijo a Eva una mentira directa y evidente; retorció la verdad. ¿Qué tienen en común las mentiras más efectivas y peligrosas que enfrentamos hoy con la estrategia de la serpiente en el Edén?</p>' +
          '<button class="answer-toggle" data-answer="a2">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a2"><span class="who">GUÍA PARA EL MAESTRO</span><p>Las mentiras más peligrosas rara vez son mentiras completas; son verdades a medias que apelan a un deseo legítimo —sabiduría, autonomía, plenitud— pero lo desconectan de la confianza en Dios. Ejemplos actuales: narrativas de autorrealización que prometen plenitud al margen de Dios, o ideas que suenan razonables pero reinterpretan en silencio lo que Dios realmente dijo. El antídoto es comparar cuidadosamente cualquier afirmación atractiva con la Palabra tal cual fue dada.</p></div>' +
        '</div>'
    },
    {
      tag: "Gracia",
      title: "Dios busca: la pregunta que ya sabía la respuesta",
      html:
        '<div class="verse-block"><span class="block-label">GÉNESIS 3:9-10</span><blockquote>«Mas Jehová Dios llamó al hombre, y le dijo: ¿Dónde estás tú? Y él respondió: Oí tu voz en el huerto, y tuve miedo, porque estaba desnudo; y me escondí.»</blockquote></div>' +
        '<p>Dios, por supuesto, sabía exactamente dónde estaba Adán. La pregunta no busca información; busca una respuesta voluntaria, una oportunidad de confesión antes de la confrontación. Es el mismo patrón que veremos con Caín («¿Dónde está Abel tu hermano?»): Dios toma la iniciativa de buscar, incluso cuando somos nosotros quienes nos escondemos.</p>' +
        '<p>Jesús capturó esta misma dinámica en la parábola del hijo pródigo: «cuando aún estaba lejos, lo vio su padre, y fue movido a misericordia, y corrió» (Luc. 15:20). Y cuando Pedro negó a Cristo tres veces, el Señor «se volvió y lo miró» (Luc. 22:61) — sin palabras, buscando el corazón de su amigo descarriado.</p>' +
        '<p>Pero observa la otra cara: cuando Dios confrontó a Adán y Eva, ninguno asumió responsabilidad. Adán culpó a Eva —y, veladamente, a Dios mismo— (Gén. 3:12); Eva culpó a la serpiente (v. 13). Pablo describe esa misma lucha interior en Romanos 7:15: «No entiendo lo que me pasa; porque no hago lo que quiero, sino lo que aborrezco».</p>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">¿Por qué Dios hace preguntas cuya respuesta ya conoce? ¿Qué nos enseña esto sobre su forma de relacionarse con nosotros incluso hoy?</p>' +
          '<button class="answer-toggle" data-answer="a3">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a3"><span class="who">GUÍA PARA EL MAESTRO</span><p>Dios no pregunta para obtener información, sino para invitar a la introspección y a la confesión voluntaria, preservando nuestra libertad y dignidad en lugar de simplemente imponernos los hechos. Hoy, Dios sigue "preguntando" —de manera menos audible pero igualmente real— a través de la convicción del Espíritu Santo, la Palabra y la voz tranquila de la conciencia.</p></div>' +
        '</div>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">Adán culpó a Eva —y veladamente a Dios—; Eva culpó a la serpiente. ¿De qué manera practicamos hoy la misma estrategia de culpar a otros en lugar de asumir responsabilidad? ¿Qué cambiaría si respondiéramos como el hijo pródigo ("Padre, he pecado") en lugar de como Adán y Eva?</p>' +
          '<button class="answer-toggle" data-answer="a4">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a4"><span class="who">GUÍA PARA EL MAESTRO</span><p>Invita a una reflexión honesta; equivalentes modernos comunes incluyen «así me criaron», «todos lo hacen» o «las circunstancias me obligaron». Contrástalo con la humildad del hijo pródigo, que no busca excusas sino reconciliación. El cambio clave es pasar de la autodefensa a la confesión genuina, que es precisamente lo que abre la puerta al perdón (1 Jn. 1:9).</p></div>' +
        '</div>'
    },
    {
      tag: "Juicio y promesa",
      title: "Lo que se perdió y lo que se prometió",
      html:
        '<p class="lead">La expulsión del Edén (Gén. 3:14-24) describe, con crudeza, el precio real del pecado: dolor, trabajo arduo, mortalidad, y la pérdida de la comunión directa con Dios.</p>' +
        '<p>Isaías lo resume así: «Las iniquidades de ustedes los separaron de su Dios» (Isa. 59:2). El contraste con el monte Sinaí es revelador: allí, cuando Dios descendió para hablar a su pueblo, la experiencia estuvo marcada por truenos, humo y un temor tan intenso que se advirtió al pueblo ni siquiera tocar el monte, «porque caerá multitud de ellos» (Éxo. 19:21). Lo que en el Edén era comunión gozosa se convirtió, tras la caída, en una santidad que el ser humano pecador no puede acercarse sin mediación.</p>' +
        '<p>Pero en medio del juicio, Dios ya sembraba esperanza. Génesis 3:15 —el primer anuncio del evangelio en toda la Escritura— promete una «simiente» que aplastaría la cabeza de la serpiente. Y el hecho de que Dios vistiera a Adán y Eva con «túnicas de pieles» (v. 21) fue un acto simbólico que apuntaba hacia la futura redención.</p>' +
        '<div class="egw-block"><span class="block-label">ESPÍRITU DE PROFECÍA</span><blockquote>«El acto de Cristo, de morir por la salvación del hombre, no solo haría accesible el cielo para los hombres, sino que ante todo justificaría a Dios y a su Hijo en su trato con la rebelión de Satanás.»</blockquote><cite>Exaltad a Jesús, 6 de noviembre, p. 318</cite></div>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">Comparado con la comunión íntima del Edén, ¿qué nos dice el temor y la distancia del encuentro en el Sinaí sobre el efecto del pecado en nuestra capacidad de relacionarnos directamente con un Dios santo?</p>' +
          '<button class="answer-toggle" data-answer="a5">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a5"><span class="who">GUÍA PARA EL MAESTRO</span><p>El pecado no cambió el carácter de Dios, sino nuestra capacidad de soportar su santidad sin un mediador. Lo que en el Edén era comunión gozosa se volvió, después de la caída, una fuente legítima de temor ante la santidad divina no mediada. Esto resalta por qué necesitamos un mediador —Cristo— que haga posible acercarnos «confiadamente» sin ser consumidos (Heb. 4:14-16).</p></div>' +
        '</div>'
    },
    {
      tag: "Revelación",
      title: "Dios sigue hablando: naturaleza, profetas y Escritura",
      html:
        '<p class="lead">Entre la caída y la cruz, Dios nunca dejó de comunicarse con la humanidad.</p>' +
        '<p>Habló, primero, a través de la creación misma: «Lo que de Dios se conoce les es manifiesto... las cosas invisibles de él, su eterno poder y deidad, se hacen claramente visibles... de modo que no tienen excusa» (Rom. 1:19-20). Habló también a través de profetas elegidos —«en visión», «en sueños» (Núm. 12:6)— cuyas palabras, en buena parte, fueron preservadas para nosotros: «Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia» (2 Tim. 3:16-17).</p>' +
        '<p class="muted">Vivimos en una era de ciencia extraordinaria, y sin embargo muchos estudian el universo a fondo sin llegar jamás a reconocer al Creador detrás de él. El conocimiento de los mecanismos no equivale al reconocimiento del Autor.</p>' +
        '<div class="egw-block"><span class="block-label">ESPÍRITU DE PROFECÍA</span><blockquote>«En la Palabra de Dios contemplamos el poder que estableció los fundamentos de la tierra... Por el estudio de las ciencias también hemos de obtener un conocimiento del Creador... Tanto el libro de la naturaleza como la Palabra escrita nos hacen conocer a Dios.»</blockquote><cite>Reflejemos a Jesús, 11 de abril, p. 107</cite></div>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">En una época de avances científicos impresionantes, ¿por qué crees que tantas personas estudian la naturaleza a fondo sin llegar jamás a reconocer al Creador detrás de ella?</p>' +
          '<button class="answer-toggle" data-answer="a6">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a6"><span class="who">GUÍA PARA EL MAESTRO</span><p>El conocimiento de los mecanismos no equivale automáticamente al reconocimiento del Autor; se puede estudiar «cómo» funciona algo sin preguntarse jamás «quién» lo hizo. Elena de White explica que la naturaleza es un libro que debe leerse junto con la Escritura: sin ese segundo testigo, es posible admirar el diseño y aun así negar al Diseñador, especialmente cuando presuposiciones filosóficas excluyen de antemano cualquier causa trascendente.</p></div>' +
        '</div>'
    },
    {
      tag: "Cristo",
      title: "El rostro visible de Dios",
      html:
        '<p class="lead">De todas las formas en que Dios ha hablado, ninguna es tan clara como su Hijo.</p>' +
        '<div class="verse-block"><span class="block-label">JUAN 14:8-9</span><blockquote>«Felipe le dijo: Señor, muéstranos el Padre, y nos basta. Jesús le dijo: ¿Tanto tiempo hace que estoy con vosotros, y no me has conocido, Felipe? El que me ha visto a mí, ha visto al Padre.»</blockquote></div>' +
        '<p>Esto significa algo profundamente práctico: si alguna vez tienes dudas sobre el carácter de Dios —si es distante, severo, indiferente—, la respuesta definitiva no está en especulaciones filosóficas, sino en observar a Jesús: su ternura con los marginados, su firmeza con la hipocresía, su disposición a morir por quienes lo rechazaban.</p>' +
        '<p>Y añade una imagen pastoral entrañable: «Mis ovejas oyen mi voz, y yo las conozco, y me siguen... nadie las arrebatará de mi mano» (Juan 10:27-28). Reconocer la voz de Dios es, en parte, un hábito que se cultiva: cuanto más familiarizados estemos con su carácter mediante la Escritura y la oración, más fácilmente distinguiremos su voz entre todo el ruido que compite por nuestra atención.</p>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">Si alguien solo conociera el carácter de Dios a través de la forma en que tú vives tu fe esta semana, ¿qué aprendería sobre él?</p>' +
          '<button class="answer-toggle" data-answer="a7">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a7"><span class="who">GUÍA PARA EL MAESTRO</span><p>Es una pregunta deliberadamente incómoda y personal; no hay una respuesta "correcta" que imponer. Ayuda a la clase a notar la enorme responsabilidad —y el privilegio— de representar el carácter de Dios ante otros, siendo en cierto sentido «cartas» vivas (2 Cor. 3:2-3). Anima a la honestidad y a identificar, en silencio, un área concreta de incoherencia a trabajar esta semana.</p></div>' +
        '</div>'
    },
    {
      tag: "El don profético",
      title: "Dios levanta voceros",
      html:
        '<p class="lead">Dios también ha hablado —y sigue hablando— a través de mensajeros humanos cuidadosamente elegidos: Noé, Abraham, Moisés, Daniel. Este trimestre dedicaremos varias semanas a estudiar a una de esas voces: Elena G. de White.</p>' +
        '<p>Su historia comienza de forma inesperada. Nacida en 1827 en Gorham, Maine, a los nueve años sufrió una lesión grave en el rostro que afectó su salud y su vida social durante años. En medio de esa incertidumbre, desarrolló un temor profundo a Dios, llegando a creer que estaba «eternamente perdida». No fue sino hasta que conoció al pastor metodista Levi Stockman que su percepción cambió por completo.</p>' +
        '<div class="egw-block"><span class="block-label">ESPÍRITU DE PROFECÍA</span><blockquote>«Sentía un inexplicable amor hacia Dios, y su Espíritu me daba testimonio de que mis pecados estaban perdonados. Cambié la opinión que tenía del Padre. Empecé a considerarlo como un padre bondadoso y tierno más bien que como un severo tirano que fuerza a los hombres a obedecerlo ciegamente. Mi corazón sentía un profundo y ferviente amor hacia él.»</blockquote><cite>Notas biográficas de Elena G. de White, p. 40</cite></div>' +
        '<p>Es, en miniatura, el mismo giro que hemos estudiado hoy: de la distancia y el temor del Sinaí, a la cercanía y la ternura reveladas en Cristo. Dios sigue levantando personas imperfectas para comunicar su carácter al mundo — no porque necesite intermediarios, sino porque, fiel a su diseño original, prefiere relacionarse con nosotros también a través de otros seres humanos.</p>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">Elena de White describió haber crecido creyendo que Dios era un "tirano severo" hasta que comprendió que él era un "Padre bondadoso y tierno". ¿De dónde crees que surgen, hoy en día, las imágenes distorsionadas de Dios que muchas personas cargan, y cómo pueden corregirse?</p>' +
          '<button class="answer-toggle" data-answer="a8">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a8"><span class="who">GUÍA PARA EL MAESTRO</span><p>Las imágenes distorsionadas de Dios suelen originarse en experiencias dolorosas con figuras de autoridad humanas, teologías del miedo, o una exposición selectiva a textos que enfatizan el juicio sin el amor. Se corrigen —como en el caso de Elena de White— mediante un encuentro renovado con el carácter de Cristo revelado en la Escritura, frecuentemente mediado por otra persona de fe genuina que modela el verdadero carácter de Dios.</p></div>' +
        '</div>'
    },
    {
      tag: "Aplicación",
      title: "Cómo seguir escuchando a Dios hoy",
      html:
        '<p class="lead">Todo lo estudiado hoy converge en una pregunta práctica: ¿cómo cultivamos, en medio del ruido digital, el trabajo y las responsabilidades, el hábito de escuchar realmente a Dios?</p>' +
        '<p>La Escritura y el Espíritu de Profecía sugieren algunos elementos constantes: el estudio deliberado de la Palabra, el contacto consciente con la naturaleza como "segundo libro" de revelación, el reposo semanal como tiempo apartado para la comunión —exactamente como en el Edén—, y la oración entendida no como un monólogo de peticiones, sino como una conversación bidireccional.</p>' +
        '<div class="egw-block"><span class="block-label">ESPÍRITU DE PROFECÍA</span><blockquote>«Cualesquiera que sean tus angustias y pruebas, expónlas al Señor. Tu espíritu encontrará sostén para sufrirlo todo... Cuanto más débil y desamparado te sientas, más fuerte serás con su ayuda.»</blockquote><cite>Exaltad a Jesús, 24 de marzo, p. 91</cite></div>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">Si tuvieras que diseñar, a partir de esta lección, un plan personal y realista para "escuchar" deliberadamente la voz de Dios cada día, ¿qué tres elementos no podrían faltar?</p>' +
          '<button class="answer-toggle" data-answer="a9">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a9"><span class="who">GUÍA PARA EL MAESTRO</span><p>Pregunta de aplicación personal y compromiso; anima respuestas concretas (por ejemplo: un horario fijo de oración y Biblia, un momento de silencio o naturaleza sin pantallas, un día de reposo verdaderamente apartado, un diario de oración). Lo importante es la especificidad y la constancia, no la cantidad de prácticas propuestas.</p></div>' +
        '</div>'
    },
    {
      tag: "Cierre",
      title: "La promesa de un reencuentro pleno",
      html:
        '<p class="lead">Desde el Edén hasta hoy, la historia de Dios con la humanidad ha sido, en esencia, la historia de alguien que se negó a dejarnos ir.</p>' +
        '<p>Nos buscó cuando nos escondimos, prometió un Salvador en medio del juicio, habló a través de la naturaleza, de los profetas y, finalmente, de su propio Hijo. Y la historia no termina aquí: la promesa final es un «nuevo cielo y nueva tierra, donde mora la justicia» (2 Ped. 3:13) — la restauración completa de aquella comunión cara a cara que se perdió en el huerto.</p>' +
        '<p>Mientras tanto, cada práctica de esta semana —un momento de silencio, una página de la Biblia, una oración honesta— es un pequeño anticipo de ese reencuentro pleno que se acerca.</p>' +
        '<div class="question-card">' +
          '<span class="question-label">PREGUNTA PARA DISCUSIÓN</span>' +
          '<p class="question-text">De todo lo que hemos visto hoy —desde el Edén hasta la promesa final—, ¿qué imagen de Dios te deja esta lección, y en qué se diferencia de la imagen de Dios que tenías antes de estudiarla?</p>' +
          '<button class="answer-toggle" data-answer="a10">Ver respuesta orientativa</button>' +
          '<div class="answer-panel" id="a10"><span class="who">GUÍA PARA EL MAESTRO</span><p>Facilita una ronda breve si el tiempo lo permite; no busques una respuesta uniforme, sino autenticidad. El objetivo es cerrar con una afirmación personal de fe, no solo información aprendida. Considera cerrar la clase orando para que esa imagen renovada de un Dios que busca, habla y se revela sea la que guíe la semana.</p></div>' +
        '</div>' +
        '<div class="closing-prompt"><p>«En estos últimos días nos habló por su Hijo.» — Hebreos 1:2</p></div>'
    }
  ];

  var current = 0;
  var total = pages.length;

  var contentInner = document.getElementById('contentInner');
  var pageTitle = document.getElementById('pageTitle');
  var sectionLabel = document.getElementById('sectionLabel');
  var pageCounterTop = document.getElementById('pageCounterTop');
  var progressFill = document.getElementById('progressFill');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var tocBtn = document.getElementById('tocBtn');
  var tocClose = document.getElementById('tocClose');
  var tocOverlay = document.getElementById('tocOverlay');
  var tocList = document.getElementById('tocList');
  var contentScroll = document.getElementById('contentScroll');

  function buildToc(){
    tocList.innerHTML = '';
    pages.forEach(function(p, i){
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.innerHTML = '<span class="n">' + (i+1).toString().padStart(2,'0') + '</span><span>' + p.title + '</span>';
      btn.setAttribute('data-i', i);
      if(i === current) btn.classList.add('active');
      btn.addEventListener('click', function(){
        goTo(i);
        closeToc();
      });
      li.appendChild(btn);
      tocList.appendChild(li);
    });
  }

  function render(){
    var p = pages[current];
    pageTitle.textContent = p.title;
    sectionLabel.textContent = p.tag;
    pageCounterTop.textContent = (current+1) + ' / ' + total;
    progressFill.style.width = ((current+1)/total*100) + '%';
    contentInner.innerHTML = p.html;
    contentInner.classList.remove('fade-in');
    void contentInner.offsetWidth;
    contentInner.classList.add('fade-in');
    contentScroll.scrollTop = 0;

    prevBtn.disabled = (current === 0);
    if(current === total - 1){
      nextBtn.textContent = 'Reiniciar ↺';
    } else if(current === 0){
      nextBtn.textContent = 'Comenzar →';
    } else {
      nextBtn.textContent = 'Siguiente ›';
    }

    var startBtn = document.getElementById('startBtn');
    if(startBtn){
      startBtn.addEventListener('click', function(){ goTo(current+1); });
    }

    buildToc();
  }

  function goTo(i){
    if(i < 0) i = 0;
    if(i > total - 1) i = total - 1;
    current = i;
    render();
  }

  prevBtn.addEventListener('click', function(){ goTo(current - 1); });
  nextBtn.addEventListener('click', function(){
    if(current === total - 1){ goTo(0); }
    else { goTo(current + 1); }
  });

  tocBtn.addEventListener('click', function(){ tocOverlay.classList.add('open'); });
  tocClose.addEventListener('click', closeToc);
  tocOverlay.addEventListener('click', function(e){ if(e.target === tocOverlay) closeToc(); });
  function closeToc(){ tocOverlay.classList.remove('open'); }

  contentInner.addEventListener('click', function(e){
    var btn = e.target.closest('.answer-toggle');
    if(!btn) return;
    var panel = document.getElementById(btn.getAttribute('data-answer'));
    if(!panel) return;
    var opening = !panel.classList.contains('open');
    panel.classList.toggle('open');
    btn.textContent = opening ? 'Ocultar respuesta' : 'Ver respuesta orientativa';
  });

  document.addEventListener('keydown', function(e){
    if(tocOverlay.classList.contains('open')) return;
    if(e.key === 'ArrowRight') goTo(current+1);
    if(e.key === 'ArrowLeft') goTo(current-1);
  });

  var touchStartX = null;
  contentScroll.addEventListener('touchstart', function(e){ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
  contentScroll.addEventListener('touchend', function(e){
    if(touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 70){
      if(dx < 0) goTo(current+1); else goTo(current-1);
    }
    touchStartX = null;
  }, {passive:true});

  render();
})();
</script>
</body>
</html>
